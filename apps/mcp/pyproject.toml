[project]
name = "mcpservers"
version = "0.1.0"
description = "MCP tool servers for the incident-triage workflow"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "openlit>=1.34",
    "httpx>=0.27",
    "opentelemetry-processor-baggage>=0.65b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpservers"]
