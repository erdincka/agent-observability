# Exposes Perses through the pre-existing Envoy Gateway, like the other UIs.
# Reachable at http://perses.kube.local once that name resolves to the gateway
# address (10.1.1.241).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perses
  namespace: agent-obs-platform
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: web
  hostnames:
    - perses.kube.local
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: perses
          port: 8080
