# Exposes Perses through the pre-existing Envoy Gateway, like the other UIs.
# The domain is GATEWAY_DOMAIN in .env (default kube.local), filled in by make.
# Reachable at http://perses.<GATEWAY_DOMAIN> once that name resolves to the gateway
# address (GATEWAY_IP in .env).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perses
  namespace: agent-obs-platform
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: web
  hostnames:
    - perses.__GATEWAY_DOMAIN__
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: perses
          port: 8080
