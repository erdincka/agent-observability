# Ollama — the self-hosted model route, and the committed default.
#
# This cluster has no GPUs, so this is CPU inference and it is slow. That is
# acceptable and deliberate: model quality is explicitly not what this project
# demonstrates, and every model call goes through the LiteLLM proxy, so swapping
# in a faster backend later is a change to one gateway config entry.
#
# It exists so the repository's default configuration actually runs. A default
# that has never been executed is a claim, not a default.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agent-obs-platform
  labels: { app.kubernetes.io/name: ollama }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: ollama }
  ports:
    - { name: http, port: 11434, targetPort: 11434 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: agent-obs-platform
spec:
  accessModes: [ReadWriteOnce]
  # local-path cannot expand. Sized for several small models rather than one.
  resources:
    requests: { storage: 30Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agent-obs-platform
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO volume; never two pods at once
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama }
    spec:
      # Pin to a worker: the control plane has 16Gi and CPU inference will
      # happily consume all of it.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      containers:
        - name: ollama
          image: ollama/ollama:0.12.3
          ports:
            - { name: http, containerPort: 11434 }
          env:
            - { name: OLLAMA_HOST,        value: "0.0.0.0:11434" }
            # Keep the model resident; reloading a 3B model from a local-path
            # disk on every request dominates the latency otherwise.
            - { name: OLLAMA_KEEP_ALIVE,  value: "24h" }
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "12", memory: 24Gi }
          readinessProbe:
            httpGet: { path: /, port: 11434 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
