# The Gateway every HTTPRoute in deploy/ attaches to: `platform` in namespace
# `gateway`, one HTTP listener named `web` on *.<GATEWAY_DOMAIN> (from .env;
# kube.local by default), routes accepted from every namespace. Rendered and
# applied by prereqs.sh. The same shape the original lab had (there it was created by
# other work); here it is what `make cluster-prereqs` creates.
#
# On a single-node k3s the Service Envoy Gateway creates for it is type
# LoadBalancer, and k3s's ServiceLB answers that with the node's own address.
# So the gateway address is the VM's address: GATEWAY_IP in .env.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      hostname: "*.__GATEWAY_DOMAIN__"
      allowedRoutes:
        namespaces:
          from: All
