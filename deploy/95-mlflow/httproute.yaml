# Exposes MLflow through the pre-existing Envoy Gateway, like the other UIs.
# Reachable at http://mlflow.kube.local once that name resolves to the gateway
# address (10.1.1.241).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlflow
  namespace: agent-obs-platform
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: web
  hostnames:
    - mlflow.kube.local
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: mlflow
          port: 80
