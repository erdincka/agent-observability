# Runs the triage graph once — the real workflow, not the plumbing proof.
#
# A Job rather than a Deployment because a triage run is a one-shot with an end,
# not a service. `make workflow-triage` templates INCIDENT, ROUTE and the image
# tag into it, so
# "same incident, other model route" is a flag rather than an edit.
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-triage
  namespace: agent-obs-app
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app.kubernetes.io/name: workflow, agent-obs.io/governed: "true" }
    spec:
      restartPolicy: Never
      containers:
        - name: workflow
          # Registry from .env; immutable commit tag with IfNotPresent, or a
          # `-dirty` tag with Always; see scripts/build-image.sh.
          image: __REGISTRY__/agent-obs/workflow:__WORKFLOW_TAG__
          imagePullPolicy: __PULL_POLICY__
          env:
            - { name: OTEL_SERVICE_NAME, value: "triage-workflow" }

            # Which incident, from the fixed corpus in incidents.py. A named id
            # rather than prose on argv: a baseline needs the input held
            # constant, and an unknown id fails loudly instead of falling back.
            - { name: INCIDENT_ID, value: "__INCIDENT__" }

            # Which LiteLLM route serves the run. The workflow never names a
            # model — swapping local for remote changes nothing in the code and
            # everything in the trace.
            - { name: MODEL_ROUTE, value: "__ROUTE__" }

            # Per-call model timeout, from .env: a property of how fast the
            # machine runs CPU inference, not of the workflow.
            - { name: MODEL_TIMEOUT, value: "__MODEL_TIMEOUT__" }

            # Stamped onto the run span so a trace says which build produced it.
            # The tag is immutable, so this names exactly one image.
            - { name: WORKFLOW_IMAGE, value: "agent-obs/workflow:__WORKFLOW_TAG__" }

            # Fallback only. With `make litellm-keys` applied, every agent
            # presents its own key (AGENT_KEY_<agent>, from Secret agent-keys)
            # and this master key is never sent.
            - name: GATEWAY_API_KEY
              valueFrom: { secretKeyRef: { name: gateway-auth, key: GATEWAY_API_KEY } }

            # --- identity (chapters 6 and 7) --------------------------------
            # On whose behalf: goes into baggage (every span) and the OpenAI
            # `user` field (the gateway's end-user id).
            - { name: PRINCIPAL, value: "__PRINCIPAL__" }
            # Which role the workflow acts in at the tool servers, and the
            # bearer token that proves it. `reader` cannot restart anything.
            - { name: AGENT_ROLE, value: "__AGENT_ROLE__" }
            - name: TOOL_TOKEN
              valueFrom: { secretKeyRef: { name: agent-tool-tokens, key: TOOL_TOKEN___AGENT_ROLE_UPPER__ } }
            # `per-agent`, or the name of a demo key (restricted, throttled)
            # that every agent then uses.
            - { name: KEY_PROFILE, value: "__KEY_PROFILE__" }
            # Chapter 8: "true" makes the SDK emit content, so the Collector's
            # redaction can be shown doing its job. Default false.
            - { name: OPENLIT_CAPTURE_CONTENT, value: "__CAPTURE__" }

            # Drives the LangGraph checkpointer. CNPG publishes `uri` as a
            # ready-made connection string, so the workflow and the database
            # agree on the credential by construction.
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: workflow-db-app, key: uri } }
          envFrom:
            # AGENT_KEY_retriever, AGENT_KEY_analyser, ... — optional: absent
            # until `make litellm-keys` has run, and the workflow says so.
            - secretRef: { name: agent-keys, optional: true }
              prefix: AGENT_KEY_
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
