# Exposes the LiteLLM UI through the Envoy Gateway (pre-existing on the original
# lab, installed by `make cluster-prereqs` on the single-VM path) rather than
# allocating another LoadBalancer address. The `platform` Gateway listens on
# *.kube.local and accepts routes from all namespaces.
#
# Reachable at http://litellm.kube.local once that name resolves to the
# gateway address (GATEWAY_IP in .env).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: agent-obs-platform
spec:
  parentRefs:
    - name: platform
      namespace: gateway
      sectionName: web
  hostnames:
    - litellm.kube.local
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: litellm
          port: 4000
