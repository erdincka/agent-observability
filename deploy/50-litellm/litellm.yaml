# LiteLLM proxy — the model gateway. Passthrough in phase 1.
#
# Deployed now rather than in phase 2 on purpose. Establishing the topology
# costs almost nothing today and means no model call has to be re-wired when the
# governance layer arrives. Every model call in this project goes through here,
# which is what makes "who called what, on whose behalf" answerable at all.
#
# The OTel v2 integration is opt-in and its defaults matter — see the env below.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: agent-obs-platform
  labels: { app.kubernetes.io/name: litellm }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: litellm }
  ports:
    - { name: http, port: 4000, targetPort: 4000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: agent-obs-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: litellm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: litellm }
      annotations:
        # Forces a rollout when the rendered config changes, since a ConfigMap
        # update alone will not restart the pod.
        checksum/config: "REPLACED_AT_DEPLOY"
    spec:
      containers:
        - name: litellm
          # Pinned to the version that was already running. `main-stable` moves:
          # on 2026-09-13 the pod ran v1.100.0 (sha256:c8756e7b...) while
          # main-stable already pointed at another build (sha256:a3715fa7...), so
          # the next pod restart would have silently changed the gateway.
          image: ghcr.io/berriai/litellm:v1.100.0
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - { name: http, containerPort: 4000 }
          env:
            # --- OpenTelemetry v2 -------------------------------------------
            # v2 is opt-in. Without this you silently get v1 behaviour, which
            # does not follow the GenAI semantic conventions.
            - { name: LITELLM_OTEL_V2, value: "true" }
            - { name: OTEL_EXPORTER,   value: "otlp_http" }
            - { name: OTEL_ENDPOINT,   value: "http://otel-collector.agent-obs-platform.svc.cluster.local:4318" }
            - { name: OTEL_SERVICE_NAME, value: "litellm-gateway" }

            # Opt in to the current GenAI conventions rather than an older
            # frozen set — being on the live semconv, experimental parts
            # included, is the point of the exercise.
            - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: "gen_ai_latest_experimental" }

            # Defaults to true, which re-emits every attribute a second time
            # under legacy Traceloop names. Left alone, ClickHouse fills with
            # two vocabularies for the same data and every query is ambiguous.
            - { name: LITELLM_OTEL_LEGACY_COMPAT, value: "false" }

            # THE control this entire project is about. `no_content` is already
            # the default; it is set explicitly because a security posture that
            # depends on nobody changing a default is not a posture. Phase 2
            # tests whether the four audit questions can still be answered with
            # this set to no_content.
            #   no_content | span_only | event_only | span_and_event
            - { name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT, value: "no_content" }

            # --- identity onto every span (chapter 6) -----------------------
            # OTel v2 promotes a bounded set of request-identity values via
            # baggage onto every span of a request. The end-user id is
            # promotable but off by default because it identifies a person;
            # this lab turns it on deliberately, because "on whose behalf" is
            # one of its four questions. The key alias is the agent's name.
            - { name: LITELLM_OTEL_BAGGAGE_PROMOTED_KEYS, value: "litellm.team.id,litellm.team.alias,litellm.api_key.hash,litellm.end_user.id,gen_ai.request.model,litellm.provider.model" }
            - { name: LITELLM_OTEL_BAGGAGE_METADATA_KEYS, value: "user_api_key_alias,user_api_key_end_user_id,user_api_key_user_id" }

            # --- state ------------------------------------------------------
            # LiteLLM is stateless for routing and stateful for identity. The
            # admin UI authenticates against a users table, so without this the
            # proxy proxies fine and every login returns
            # "Authentication Error, Not connected to DB!".
            #
            # CNPG publishes `uri` as a ready-made connection string, so the
            # gateway and the database agree on the credential by construction
            # rather than by two copies being kept in step.
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: litellm-db-app, key: uri } }

            # Encrypts provider credentials at rest in that database. It
            # defaults to the master key, which quietly couples key rotation to
            # data readability: rotate LITELLM_MASTER_KEY and every stored
            # credential becomes undecryptable, with no error until something
            # tries to use one. Separate value, rotated on its own schedule.
            - name: LITELLM_SALT_KEY
              valueFrom: { secretKeyRef: { name: litellm-auth, key: LITELLM_SALT_KEY } }

            # UI login. Without these the username is `admin` and the password
            # is the master key — i.e. the credential that grants full API
            # access is also typed into a browser form. Splitting them means a
            # UI password can be handed out without handing out the API.
            - name: UI_USERNAME
              valueFrom: { secretKeyRef: { name: litellm-auth, key: LITELLM_UI_USERNAME } }
            - name: UI_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-auth, key: LITELLM_UI_PASSWORD } }

            # Deliberately false. With this on, models added through the UI are
            # persisted in Postgres and merged with the rendered config.yaml —
            # two sources of truth for the model list, one of them invisible to
            # this repository. Step 3 already cost an hour to a config and its
            # secret being applied by different commands; this is the same trap
            # with a database in it. The model list comes from .env, or it does
            # not come from anywhere.
            - { name: STORE_MODEL_IN_DB, value: "false" }

            # --- routing ----------------------------------------------------
            - name: OLLAMA_BASE_URL
              valueFrom: { secretKeyRef: { name: litellm-auth, key: OLLAMA_BASE_URL } }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-auth, key: LITELLM_MASTER_KEY } }
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-auth, key: OPENROUTER_API_KEY, optional: true }
          volumeMounts:
            - { name: config, mountPath: /etc/litellm }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
          # First boot runs the Prisma schema migration against an empty
          # database before the port answers anything. A readiness probe alone
          # would mark the pod unready and `rollout status` would fail on a
          # deploy that is merely slow. The startup probe holds the door open
          # for up to five minutes; readiness stays tight once it is through.
          startupProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: litellm-config }
