---
# mcp-ops — the one server with a tool that changes state (chapter 7).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-ops
  namespace: agent-obs-app
---
# The blast radius, spelled out: Deployments in this namespace, list and
# patch. No secrets, no pods, no other namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-ops
  namespace: agent-obs-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-ops
  namespace: agent-obs-app
subjects:
  - { kind: ServiceAccount, name: mcp-ops, namespace: agent-obs-app }
roleRef: { kind: Role, name: mcp-ops, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-ops
  namespace: agent-obs-app
  labels: { app.kubernetes.io/name: mcp-ops }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: mcp-ops }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ops
  namespace: agent-obs-app
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mcp-ops }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mcp-ops, agent-obs.io/governed: "true" }
    spec:
      serviceAccountName: mcp-ops
      volumes:
        - { name: policy, configMap: { name: tool-policy } }
      containers:
        - name: server
          image: 10.1.1.240:5000/agent-obs/mcp:__MCP_TAG__
          imagePullPolicy: __PULL_POLICY__
          command: ["python", "-m", "mcpservers.ops_server"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: OTEL_SERVICE_NAME, value: "mcp-ops" }
            - { name: OTLP_ENDPOINT, value: "http://otel-collector.agent-obs-platform.svc.cluster.local:4318" }
          envFrom:
            - secretRef: { name: agent-tool-tokens }
          volumeMounts:
            - { name: policy, mountPath: /etc/mcp, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
