# The three MCP tool servers, one Deployment each.
#
# Separate pods speaking streamable HTTP, not stdio subprocesses of the
# workflow. That choice is the point: in-process, trace context would stay
# continuous for free and the agent-to-tool boundary would demonstrate nothing.
# A real network hop is what makes MCP's silence on trace propagation visible —
# and phase 2's per-role tool access needs somewhere to actually enforce.
#
# One image backs all four; the Deployment's args choose which server runs.
# The image tag and pull policy are filled in by `make mcp`; applying this file
# directly will not work.
#
# Chapter 7: every server mounts the same role->tool policy (ConfigMap
# tool-policy, from policy.json) and the same role->token map (Secret
# agent-tool-tokens, from .env). The fourth server, mcp-ops, is the one with a
# tool that changes state; its ServiceAccount is bound to a Role that can list
# and patch Deployments in this namespace and nothing else.
#
# The label agent-obs.io/governed=true selects these pods for the
# NetworkPolicies in deploy/85-netpol/.

---
# mcp-metrics — Queries the Prometheus already running in this lab.
apiVersion: v1
kind: Service
metadata:
  name: mcp-metrics
  namespace: agent-obs-app
  labels: { app.kubernetes.io/name: mcp-metrics }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: mcp-metrics }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-metrics
  namespace: agent-obs-app
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mcp-metrics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mcp-metrics, agent-obs.io/governed: "true" }
    spec:
      volumes:
        - { name: policy, configMap: { name: tool-policy } }
      containers:
        - name: server
          # Immutable commit tag with IfNotPresent, or a `-dirty` tag with Always.
          # The 0.1.0 tag this replaced was rebuilt in place and nodes kept serving
          # cached code; see scripts/build-image.sh.
          image: 10.1.1.240:5000/agent-obs/mcp:__MCP_TAG__
          imagePullPolicy: __PULL_POLICY__
          command: ["python", "-m", "mcpservers.metrics_server"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: OTEL_SERVICE_NAME, value: "mcp-metrics" }
            - { name: OTLP_ENDPOINT, value: "http://otel-collector.agent-obs-platform.svc.cluster.local:4318" }
            - { name: PROMETHEUS_URL, value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090" }
          envFrom:
            - secretRef: { name: agent-tool-tokens }
          volumeMounts:
            - { name: policy, mountPath: /etc/mcp, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }

